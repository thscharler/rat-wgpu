[package]
name = "rat-wgpu"
version = "1.0.1"
authors = ["thscharler <thscharler@gmail.com>"]
edition = "2024"
description = "ratatui backend with wgpu rendering"
license = "MIT/Apache-2.0"
repository = "https://github.com/thscharler/rat-wgpu"
readme = "readme.md"
keywords = ["ratatui", "wgpu", "backend"]
categories = ["command-line-interface", "gui"]

[features]
default = ["fallback_font"]

# Scale the resulting TUI to the exact window-size. Might look a bit stretched.
scale_to_window = []
# Add NotoSansMono-Regular as fallback font.
fallback_font = []
# Add NotoEmoji-Regular as default emoji font.
fallback_emoji_font = []
# Add NotoSansSymbols2-Regular as default symbol font.
fallback_symbol_font = []
# Support fonts with png data.
png = ["dep:png"]

# Support for winit events
winit-event = ["dep:winit", "dep:crossterm"]

[dependencies]
bitvec = { version = "1.1", default-features = false, features = ["std"] }
bytemuck = { version = "1.25", features = ["derive"] }
crossterm = { version = "0.29", optional = true }
euclid = "0.22"
evictor = { version = "0.7", default-features = false }
fontdb = "0.24.0"
log = "0.4"
png = { version = "0.18", optional = true }
raqote = { version = "0.8", default-features = false }
ratatui-core = "0.1"
rustybuzz = "0.20"
ttf-parser = "0.25"
unicode-bidi = "0.3"
unicode-properties = "0.1"
unicode-width = "0.2"
wgpu = "30.0"
winit = { version = "0.30", optional = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
ratatui-widgets = { version = "0.3", default-features = false }
rat-widget = { version = "3.3" }
rat-theme4 = { version = "4.5" }
serial_test = "4.0"
futures-lite = "2.6"
anyhow = "1.0"
env_logger = "0.11"
palette = "0.7"
chrono = "0.4"

